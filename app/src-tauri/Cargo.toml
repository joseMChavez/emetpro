[package]
name = "app"
version = "0.12.0"
description = "EmetPro: projection and live streaming for churches"
authors = ["joseMChavez"]
license = "GPL-3.0-only"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
roxmltree = "0.21.2"
obws = "0.15.0"
tokio = { version = "1.54.1", features = ["time", "sync", "net", "macros"] }
uuid = { version = "1.29.0", features = ["v4"] }
# SQLite compilado dentro de la app: los instaladores no dependen de la versión del sistema.
rusqlite = { version = "0.41", features = ["bundled"] }
# Descarga de la copia privada de LibreOffice (libreoffice.rs). TLS del sistema: sin compilar OpenSSL ni aws-lc.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy"] }
sha2 = "0.10"
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio", "query", "json"] }
# Sirve los videos por HTTP local (core/media_server.rs): rangos, HEAD y archivos grandes sin cargarlos en memoria.
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Sacar la letra de una pista (Media Studio, D-029): whisper.cpp compilado dentro de la app; el modelo se descarga
# aparte solo si el usuario lo pide (studio/whisper.rs). Necesita cmake y clang para compilar.
whisper-rs = "=0.16.0"
# Quitar la voz de una pista (studio/separate): htdemucs en ONNX Runtime, cargado en tiempo de ejecución desde la copia
# que se descarga solo si el usuario lo pide (no se descarga nada al compilar). Todo en Rust puro, sin código en C.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }
rustfft = "=6.4.1"
symphonia = { version = "=0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "all-meta", "opt-simd"] }
rubato = "=5.0.1"
flacenc = { version = "=0.5.1", default-features = false }
zip = { version = "=9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }


# whisper.cpp sin optimizar tarda muchísimo más: también optimizado al compilar para probar.
[profile.dev.package.whisper-rs-sys]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Acceso a GTK para pantalla completa en un monitor concreto (necesario en Wayland).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
